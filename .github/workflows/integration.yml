name: TGR integration

on:
  push:
    branches:
      - codex/tgr-master-brd-v1
      - codex/tgr-staging-v1
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tgr-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/tgr_consulting_test
      CHROMIUM_PATH: /usr/bin/google-chrome

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: tgr_consulting_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=45
          --health-start-period=15s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Apply all tracked migrations
        run: pnpm exec drizzle-kit migrate
      - name: Unit and UI test suite
        run: pnpm test
      - name: MySQL integration suite
        run: pnpm run test:integration:ci
      - name: Staging seed idempotency and Golden reconciliation
        run: pnpm run test:staging:seed:ci
      - name: TypeScript check
        run: pnpm run check
      - name: Production build
        run: pnpm run build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Verify E2E runner prerequisites
        run: |
          test -x "$CHROMIUM_PATH"
          docker compose version
      - name: Authenticated E2E master
        run: pnpm run test:e2e:master

  deploy-staging:
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/tgr-staging-v1' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@4.29.0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Link staging service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway link
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --environment "${{ vars.RAILWAY_ENVIRONMENT }}"
          --service "${{ vars.RAILWAY_SERVICE }}"

      - name: Bind public staging runtime contract without triggering an extra deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway variable set
          "GIT_SHA=${GITHUB_SHA}"
          "APP_ENV=staging"
          "AUTH_MODE=staging_password"
          "VITE_AUTH_MODE=staging_password"
          --skip-deploys

      - name: Deploy verified staging artifact
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --message "staging ${GITHUB_SHA}"

      - name: QA authenticated staging URL
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          STAGING_URL: ${{ vars.STAGING_URL }}
          STAGING_AUTH_USERNAME: ${{ vars.STAGING_AUTH_USERNAME }}
          STAGING_AUTH_PASSWORD: ${{ secrets.STAGING_AUTH_PASSWORD }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: pnpm run test:staging:url
